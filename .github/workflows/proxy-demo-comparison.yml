name: Proxy Demo Comparison

on:
  push:
    branches-ignore: [main]
    paths:
      - "examples/zsui_proxy_client.rs"
      - "scripts/measure-proxy-demo-comparison.ps1"
      - "scripts/check-proxy-demo-results.ps1"
      - "scripts/proxy-demo-flicker-control.ps1"
      - "scripts/set-windows-display-scale.ps1"
      - "src/render_protocol.rs"
      - "src/windows_gdi_renderer.rs"
      - "src/platform/windows/**"
      - "src/platform/desktop_runtime/windows_smoke.rs"
      - ".github/workflows/proxy-demo-comparison.yml"
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Ref measured as the whole-frame baseline
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: proxy-demo-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Server 2025 at ${{ matrix.scale }}% scale
    runs-on: windows-2025
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - scale: 100
            width: 0
            height: 0
            transition: 0
          - scale: 150
            width: 1920
            height: 1080
            transition: 100
          # The hosted display adapter offers at most 1920x1080, where
          # Windows offers 100% to 175%.
          - scale: 175
            width: 1920
            height: 1080
            transition: 100
    env:
      RUST_BACKTRACE: "1"

    steps:
      - name: Checkout new design
        uses: actions/checkout@v7
        with:
          path: new

      - name: Checkout current design
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline_ref || 'main' }}
          path: old

      - name: Add the same demo to the current design
        shell: pwsh
        run: |
          Copy-Item new/examples/zsui_proxy_client.rs old/examples/zsui_proxy_client.rs -Force
          if (-not (Select-String -Path old/Cargo.toml -Pattern 'name = "zsui_proxy_client"' -Quiet)) {
            Add-Content -Path old/Cargo.toml -Value @(
              ""
              "[[example]]"
              'name = "zsui_proxy_client"'
              'path = "examples/zsui_proxy_client.rs"'
              'required-features = ["window", "button", "label", "textbox", "toggle", "list"]'
            )
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            new -> target
            old -> target

      - name: Build both designs
        shell: pwsh
        run: |
          $bin = New-Item -ItemType Directory -Force -Path target/proxy-demo-bin
          foreach ($tree in @(@{ path = "old"; name = "baseline" }, @{ path = "new"; name = "candidate" })) {
            foreach ($app in @(
              @{ example = "zsui_proxy_client"; features = "window,button,label,textbox,toggle,list"; name = "proxy" },
              @{ example = "zsui_notepad"; features = "notepad-demo,accessibility"; name = "notepad" }
            )) {
              cargo build `
                --release `
                --locked `
                --manifest-path "$($tree.path)/Cargo.toml" `
                --example $app.example `
                --no-default-features `
                --features $app.features
              if ($LASTEXITCODE -ne 0) {
                throw "the $($tree.path) $($app.example) build failed"
              }
              Copy-Item "$($tree.path)/target/release/examples/$($app.example).exe" `
                (Join-Path $bin "$($tree.name)-$($app.name).exe")
            }
          }

      - name: Configure the display
        if: matrix.scale != 100
        shell: pwsh
        run: |
          ./new/scripts/set-windows-display-scale.ps1 `
            -Width ${{ matrix.width }} `
            -Height ${{ matrix.height }} `
            -Scale ${{ matrix.scale }}

      - name: Measure memory, latency, pixels, tearing and flicker
        shell: pwsh
        run: |
          ./new/scripts/measure-proxy-demo-comparison.ps1 `
            -BaselineProxy target/proxy-demo-bin/baseline-proxy.exe `
            -CandidateProxy target/proxy-demo-bin/candidate-proxy.exe `
            -BaselineNotepad target/proxy-demo-bin/baseline-notepad.exe `
            -CandidateNotepad target/proxy-demo-bin/candidate-notepad.exe `
            -Scale ${{ matrix.scale }} `
            -TransitionScale ${{ matrix.transition }} `
            -Output target/proxy-demo-comparison
          Get-Content target/proxy-demo-comparison/summary.md | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content target/proxy-demo-comparison/summary.md
          Get-Content target/proxy-demo-comparison/summary.json

      - name: Enforce measured regression gates
        shell: pwsh
        run: ./new/scripts/check-proxy-demo-results.ps1 -Summary target/proxy-demo-comparison/summary.json

      - name: Upload measurements and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proxy-demo-comparison-windows-2025-${{ matrix.scale }}
          path: target/proxy-demo-comparison
          retention-days: 30
