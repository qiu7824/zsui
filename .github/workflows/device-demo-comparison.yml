name: Device Demo Builds

on:
  push:
    branches: [main, codex/device-demo-validation]
    paths:
      - "examples/device_console.rs"
      - "examples/support/device_demo.rs"
      - "comparisons/**/device_console.rs"
      - "comparisons/gpui_kit/**"
      - "comparisons/tauri_notepad/frontend-device/**"
      - "comparisons/tauri_notepad/tauri.device-demo.conf.json"
      - "scripts/measure-ui-performance-matrix.ps1"
      - ".github/workflows/device-demo-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-demo-comparison-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve GPUI Kit lockfile
        run: |
          if (-not (Test-Path comparisons/gpui_kit/Cargo.lock)) {
            cargo generate-lockfile --manifest-path comparisons/gpui_kit/Cargo.toml
            if ($LASTEXITCODE -ne 0) { throw 'GPUI Kit dependency resolution failed' }
          }
      - name: Inspect build capacity
        run: |
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,Used,Free
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP\zsui-device-comparison\target" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          key: device-demo-windows-v1
          workspaces: . -> ${{ runner.temp }}/zsui-device-comparison/target
          cache-on-failure: true
      - name: Validate shared interaction model
        run: |
          rustc --edition 2024 --test examples/support/device_demo.rs -o "$env:RUNNER_TEMP/device-model-tests.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Model test compilation failed' }
          & "$env:RUNNER_TEMP/device-model-tests.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Shared interaction contract failed' }
      - name: Build six release demos
        id: build
        run: |
          ./scripts/measure-ui-performance-matrix.ps1 -DeviceDemo -BuildOnly -SupportRoot "$env:RUNNER_TEMP/zsui-device-comparison"
      - name: Record reproducible demo artifacts
        id: manifest
        run: |
          $bin=Join-Path $env:RUNNER_TEMP 'zsui-device-comparison/bin-performance-matrix'
          $artifacts=@()
          foreach($framework in @('zsui','egui','iced','slint','tauri','gpui')) {
            $path=Join-Path $bin "$framework-device.exe"
            if(-not (Test-Path -LiteralPath $path)){throw "Missing $framework executable"}
            $artifacts+=@{framework=$framework;file="$framework-device.exe";bytes=(Get-Item -LiteralPath $path).Length;sha256=(Get-FileHash -LiteralPath $path).Hash}
          }
          @{schema='zsui.device-demo-build/v1';source=(& git rev-parse HEAD);rustc=(& rustc -V);profile='release: opt-level=z, thin LTO, codegen-units=1, strip=symbols, panic=abort';shared_model_sha256=(Get-FileHash examples/support/device_demo.rs).Hash;artifacts=$artifacts} | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $bin 'build-manifest.json') -Encoding utf8
          Copy-Item LICENSE (Join-Path $bin 'LICENSE-ZSUI.txt')
          Copy-Item comparisons/device_demo/README.md (Join-Path $bin 'README.md')
          "Native measurements require a desktop with the renderers' graphics APIs. This job verifies builds and the shared model; it does not certify GPU timing or native screenshots." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload measurements and lockfile
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: device-demo-build-records-windows-2025
          path: |
            ${{ runner.temp }}/zsui-device-comparison/results
            comparisons/gpui_kit/Cargo.lock
          if-no-files-found: error
          retention-days: 14
      - name: Upload demo applications
        if: always() && steps.manifest.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: device-demo-applications-windows-2025
          path: ${{ runner.temp }}/zsui-device-comparison/bin-performance-matrix
          retention-days: 14
