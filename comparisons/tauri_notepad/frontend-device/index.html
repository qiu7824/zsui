<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备控制台</title>
<style>
:root{--blue:#0067c0;--muted:#616161;--green:#0f7b0f;--bg:#f3f3f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1b1b1b;font:14px "Segoe UI","Microsoft YaHei UI",sans-serif}main{padding:24px;display:flex;flex-direction:column;gap:16px}.header{height:60px;display:flex;align-items:center;justify-content:space-between}h1{font-size:28px;line-height:36px;margin:0;font-weight:600}.sub,.caption{font-size:12px;line-height:16px;color:var(--muted)}.sub{margin-top:5px}.stats{height:96px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border-radius:12px}.stat{padding:16px}.stat-value{display:flex;align-items:center;gap:8px;margin-top:5px}.stat-value b{font-size:28px;line-height:36px;font-weight:600}.accent{color:var(--blue)}.body{display:grid;grid-template-columns:1fr 260px;gap:16px;height:440px}.list-card,.details{padding:18px}.list-heading{display:flex;align-items:center;justify-content:space-between;height:24px;margin-bottom:12px}.filters{display:flex;gap:12px;align-items:center;height:34px;margin-bottom:12px}.filters input[type=text]{flex:1;min-width:0;height:34px;padding:5px 11px;border:1px solid #d1d1d1;border-radius:4px;background:#fafafa;font:inherit}.filters label{display:flex;align-items:center;white-space:nowrap;gap:5px}.device-list{display:flex;flex-direction:column;gap:5px}.device-row{display:flex;gap:12px;align-items:center;height:48px;padding:5px 7px;border-radius:8px}.device-row.selected{background:var(--bg)}.marker{width:3px;height:28px;background:transparent;border-radius:2px}.selected .marker{background:var(--blue)}.device-name{flex:1;min-width:0}.device-name b{display:block;line-height:20px;font-weight:600}.selected .device-name b{color:var(--blue)}.device-name small{display:block;font-size:12px;line-height:16px;color:var(--muted);margin-top:2px}.status{font-size:12px;width:66px;color:var(--muted)}.online{color:var(--green)}button{font:inherit;cursor:pointer;border:1px solid #d1d1d1;background:#fff;border-radius:4px}.device-row button{width:28px;height:28px;font-size:22px;line-height:22px}.device-row button:hover{background:#eef4fa}.details{display:flex;flex-direction:column;gap:10px}.details h2{font-size:20px;line-height:28px;margin:0;font-weight:600}.info{display:flex;align-items:center;justify-content:space-between;height:24px}.info b{font-weight:600}hr{height:1px;border:0;background:#d1d1d1;width:100%;margin:0}.load-heading{display:flex;align-items:center;justify-content:space-between;height:28px}.load-heading b{font-weight:600}input[type=range]{width:100%;height:28px;margin:0;accent-color:var(--blue)}progress{width:100%;height:4px;accent-color:var(--blue)}.grow{flex:1}.primary{height:34px;background:var(--blue);color:white;border-color:var(--blue)}.primary:hover{background:#005dad}.empty main{display:none}
</style></head><body><main>
<header class="header"><div><h1>设备控制台</h1><div class="sub">查看连接状态，调整模拟负载</div></div><span class="caption">DEVICE CONSOLE / 本地演示</span></header>
<section class="stats"><div class="card stat"><div class="caption">在线设备</div><div class="stat-value"><b class="accent">04</b><span class="caption">/ 6 台</span></div></div><div class="card stat"><div class="caption">平均响应</div><div class="stat-value"><b>20</b><span class="caption">ms</span></div></div><div class="card stat"><div class="caption">模拟负载</div><div class="stat-value"><b id="metric-load">42</b><span class="caption">%</span></div></div></section>
<section class="body"><div class="card list-card"><div class="list-heading"><b>设备列表</b><span class="caption" id="device-count">6 台设备</span></div><div class="filters"><input id="query" type="text" aria-label="筛选设备" placeholder="搜索名称或类型"><label><input id="online" type="checkbox">仅在线</label></div><div id="devices" class="device-list"></div></div>
<aside class="card details"><div class="caption" id="device-id"></div><h2 id="device-name"></h2><div class="caption" id="device-kind"></div><div style="height:8px"></div><div class="info"><span class="caption">连接状态</span><b id="device-status"></b></div><div class="info"><span class="caption">响应时间</span><b id="device-latency"></b></div><hr><div class="load-heading"><b>负载模拟</b><span class="accent" id="load-value">42%</span></div><input id="load" type="range" min="0" max="100" value="42" aria-label="负载模拟"><progress id="progress" max="100" value="42"></progress><div class="caption">拖动滑块调整演示数据</div><div class="grow"></div><button id="reset" class="primary">恢复默认</button></aside></section>
</main><script>
const config=window.DEVICE_DEMO;let selected=0;
function render(){const query=document.querySelector('#query').value.toLowerCase(),online=document.querySelector('#online').checked,container=document.querySelector('#devices');container.replaceChildren();let count=0;for(const d of config.devices){if((online&&!d.online)||(!d.name.toLowerCase().includes(query)&&!d.kind.toLowerCase().includes(query)))continue;count++;const row=document.createElement('div');row.className='device-row'+(d.id===selected?' selected':'');const marker=document.createElement('div');marker.className='marker';row.appendChild(marker);const name=document.createElement('div');name.className='device-name';const title=document.createElement('b');title.textContent=d.name.split(' / ')[0];const kind=document.createElement('small');kind.textContent=d.kind;name.append(title,kind);row.appendChild(name);const status=document.createElement('div');status.className='status'+(d.online?' online':'');status.textContent=d.online?'● 在线':'○ 离线';row.appendChild(status);const button=document.createElement('button');button.textContent='›';button.setAttribute('aria-label','查看设备');button.onclick=()=>{selected=d.id;render()};row.appendChild(button);container.appendChild(row)}document.querySelector('#device-count').textContent=`${count} 台设备`;const d=config.devices[selected];document.querySelector('#device-id').textContent=`DEVICE ${String(selected+1).padStart(2,'0')}`;document.querySelector('#device-name').textContent=d.name.split(' / ')[0];document.querySelector('#device-kind').textContent=d.kind;const status=document.querySelector('#device-status');status.textContent=d.online?'在线':'离线';status.className=d.online?'online':'';document.querySelector('#device-latency').textContent=d.online?`${d.latency} ms`:'—'}
function load(){const value=document.querySelector('#load').value;document.querySelector('#load-value').textContent=`${value}%`;document.querySelector('#metric-load').textContent=value;document.querySelector('#progress').value=value}
document.querySelector('#query').oninput=render;document.querySelector('#online').onchange=render;document.querySelector('#load').oninput=load;document.querySelector('#reset').onclick=()=>{selected=0;document.querySelector('#query').value='';document.querySelector('#online').checked=false;document.querySelector('#load').value=42;render();load()};render();load();if(config.empty)document.body.classList.add('empty');
if(config.repaint){const started=performance.now();setInterval(()=>{document.querySelector('#load').value=Math.floor((performance.now()-started)/16)%101;load()},16)}
</script></body></html>
